[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slopify"
version = "0.1.0"
description = "Make human-written text look like AI slop, with minimal edits."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "James Hobson" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
slopify = "slopify.cli:slopify_main"
deslopify = "slopify.cli:deslopify_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slopify = ["data/*.json"]
